name: CI/CD Pipeline

# Workflow for testing and deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-key' }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
      VITE_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'admin@example.com' }}
      CI: true
      NODE_ENV: test
      DEBUG: pw:api*

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Dependencies installed successfully"
          echo "Package.json contents:"
          cat package.json | head -20

      - name: Type check
        run: |
          echo "Starting TypeScript type check..."
          npm run type-check
          echo "TypeScript type check completed"

      - name: Clear ESLint cache
        run: |
          find . -name ".eslintcache" -delete || true

      - name: Lint
        run: |
          echo "Starting ESLint..."
          npm run lint
          echo "ESLint completed"

      - name: Build
        run: |
          echo "Starting build process..."
          npm run build
          echo "Build completed"
          echo "Build output contents:"
          ls -la dist/ || echo "No dist directory found"

      - name: Install Playwright
        run: |
          echo "Installing Playwright..."
          npx playwright install --with-deps chromium
          echo "Playwright installation completed"
          echo "Playwright version:"
          npx playwright --version

      - name: Create test directories
        run: |
          mkdir -p test-results
          mkdir -p playwright-report
          echo "Test directories created"

      - name: Run E2E tests
        run: |
          echo "Starting Playwright tests..."
          npm run test
          echo "Test execution completed"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-key' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          VITE_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'admin@example.com' }}
        timeout-minutes: 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-key' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          VITE_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'admin@example.com' }}

      - name: Check build output
        run: |
          echo "Checking build output..."
          ls -la dist/
          echo "Build output verified"

      - name: Deploy to Vercel
        run: |
          echo "Starting deployment to Vercel..."
          npm install -g vercel@latest
          vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
          echo "Deployment completed"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-key' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          VITE_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'admin@example.com' }}
        timeout-minutes: 10
