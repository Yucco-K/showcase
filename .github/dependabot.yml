# Dependabot設定
# 依存関係の自動更新とセキュリティアラートを管理
# 更新はエコシステムごとに月1回・1本のPRにグループ化し、PRタブが散らからないようにする

version: 2
updates:
  # npm (メインプロジェクト)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "Yucco-K"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm (ポートフォリオページ)
  - package-ecosystem: "npm"
    directory: "/portfolio-page"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      portfolio-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "Yucco-K"
    labels:
      - "dependencies"
      - "npm"
      - "portfolio"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # pip (Python依存関係)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "Yucco-K"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
    reviewers:
      - "Yucco-K"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
