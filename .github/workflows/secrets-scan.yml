name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 全履歴を取得（過去のコミットもスキャン）

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Upload Gitleaks Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  trufflehog:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pull_requestではPRのターゲットブランチ(base_ref)とHEADの差分のみスキャンする。
      # main以外(develop等)をターゲットにしたPRでもbase_refを使うことで差分範囲がずれない。
      - name: Run TruffleHog (pull_request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: HEAD
          extra_args: --only-verified

      # push（mainへの直接push/squash merge含む）やworkflow_dispatchではbase/headを
      # 指定するとbase==headになりTruffleHogがエラー終了するため、base/head自体を
      # 渡さずTruffleHog本体にpush前後のコミット範囲を自動検出させる。
      - name: Run TruffleHog (push / workflow_dispatch)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          extra_args: --only-verified

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🔐 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Gitleaks: ${{ needs.gitleaks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ TruffleHog: ${{ needs.trufflehog.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.gitleaks.result }}" == "failure" ] || [ "${{ needs.trufflehog.result }}" == "failure" ]; then
            echo "⚠️ **Warning**: Potential secrets detected!" >> $GITHUB_STEP_SUMMARY
            echo "Please review the scan results and remove any sensitive information." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✨ No secrets detected. Safe to proceed!" >> $GITHUB_STEP_SUMMARY
          fi
